apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ui
  namespace: vib-banking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-ui
  template:
    metadata:
      labels:
        app: frontend-ui
    spec:
      containers:
      - name: frontend
        image: vib-frontend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: vib-banking
spec:
  selector:
    app: frontend-ui
  ports:
  - port: 80
    targetPort: 80