apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ui
  namespace: vib-banking
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend-ui
  template:
    metadata:
      labels:
        app: frontend-ui
    spec:
      containers:
      - name: frontend
        image: vib-frontend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        volumeMounts:
        - name: frontend-html-vol
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
        - name: frontend-assets-vol
          mountPath: /usr/share/nginx/html/assets/index-CwepthQE.js
          subPath: index-CwepthQE.js
        - name: frontend-assets-vol
          mountPath: /usr/share/nginx/html/assets/index-BrPHErNH.css
          subPath: index-BrPHErNH.css
        - name: frontend-bundle-vol
          mountPath: /usr/share/nginx/html/assets/index-C9lvHj9A.js
          subPath: index-C9lvHj9A.js
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: frontend-html-vol
        configMap:
          name: frontend-html
      - name: frontend-assets-vol
        configMap:
          name: frontend-assets
      - name: frontend-bundle-vol
        configMap:
          name: frontend-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: vib-banking
spec:
  selector:
    app: frontend-ui
  ports:
  - port: 80
    targetPort: 80
