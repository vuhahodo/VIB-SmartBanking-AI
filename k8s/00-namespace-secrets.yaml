apiVersion: v1
kind: Namespace
metadata:
  name: vib-banking
---
apiVersion: v1
kind: Secret
metadata:
  name: vib-secrets
  namespace: vib-banking
type: Opaque
stringData:
  # Cấu hình PostgreSQL (cho cả container postgres và backend)
  POSTGRES_USER: "vib_admin"
  POSTGRES_PASSWORD: "SecureVIBPassword2026!"
  POSTGRES_DB: "vib_db"
  DATABASE_URL: "postgresql+psycopg://vib_admin:SecureVIBPassword2026!@postgres-svc.vib-banking.svc.cluster.local:5432/vib_db"
  
  # Bảo mật JWT và chế độ Demo
  JWT_SECRET: "vib-super-secure-jwt-secret-key-production-2026-very-long"
  JWT_EXPIRE_MINUTES: "120"
  # Tắt endpoint liệt kê tài khoản demo (GET /api/auth/demo-accounts trả 404).
  # Tài khoản demo vẫn đăng nhập được: 00992830 / 123456.
  DEMO_MODE: "false"
---
# Alias secret để đảm bảo tương thích ngược với bất kỳ manifest cũ nào
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: vib-banking
type: Opaque
stringData:
  POSTGRES_USER: "vib_admin"
  POSTGRES_PASSWORD: "SecureVIBPassword2026!"
  POSTGRES_DB: "vib_db"
  DATABASE_URL: "postgresql+psycopg://vib_admin:SecureVIBPassword2026!@postgres-svc.vib-banking.svc.cluster.local:5432/vib_db"
  JWT_SECRET: "vib-super-secure-jwt-secret-key-production-2026-very-long"
  JWT_EXPIRE_MINUTES: "120"
  DEMO_MODE: "false"
