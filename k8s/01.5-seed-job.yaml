apiVersion: batch/v1
kind: Job
metadata:
  name: vib-db-seed
  namespace: vib-banking
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: vib-db-seed
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z -w 2 postgres-svc 5432; do echo "Waiting for PostgreSQL..."; sleep 2; done; echo "PostgreSQL is reachable!";']
      containers:
      - name: seed
        image: vib-backend:v4
        imagePullPolicy: IfNotPresent
        command: ["python", "seed.py"]
        envFrom:
        - secretRef:
            name: vib-secrets

