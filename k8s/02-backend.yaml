apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: vib-banking
spec:
  replicas: 2
  # Cập nhật cuốn chiếu không gián đoạn: luôn giữ đủ pod Ready, thêm 1 pod mới rồi mới bỏ pod cũ.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z -w 2 postgres-svc 5432; do echo "Waiting for PostgreSQL..."; sleep 2; done; echo "PostgreSQL is ready!";']
      containers:
      - name: backend
        image: vib-backend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        # Bỏ đặc quyền: không leo thang quyền, bỏ toàn bộ Linux capability, dùng seccomp mặc định.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        envFrom:
        - secretRef:
            name: vib-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: vib-banking
spec:
  selector:
    app: backend-api
  ports:
  - port: 8000
    targetPort: 8000
