apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: vib-banking
spec:
  replicas: 2
  # Cập nhật cuốn chiếu không gián đoạn: luôn giữ đủ pod Ready, thêm 1 pod mới rồi mới bỏ pod cũ.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z -w 2 postgres-svc 5432; do echo "Waiting for PostgreSQL..."; sleep 2; done; echo "PostgreSQL is ready!";']
      containers:
      - name: backend
        image: vib-backend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        # Bỏ đặc quyền: không leo thang quyền, bỏ toàn bộ Linux capability, dùng seccomp mặc định.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        envFrom:
        - secretRef:
            name: vib-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 40
          periodSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - mountPath: /app/app/schemas.py
          name: backend-override-vol
          subPath: schemas.py
        - mountPath: /app/app/routers/recommendations.py
          name: backend-override-vol
          subPath: recommendations.py
        - mountPath: /app/app/routers/auth.py
          name: backend-override-vol
          subPath: auth.py
        - mountPath: /app/app/routers/applications.py
          name: backend-override-vol
          subPath: applications.py
        - mountPath: /app/app/routers/ops.py
          name: backend-override-vol
          subPath: ops.py
        - mountPath: /app/app/main.py
          name: backend-override-vol
          subPath: main.py
      volumes:
      - configMap:
          defaultMode: 420
          name: backend-override
        name: backend-override-vol
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: vib-banking
spec:
  selector:
    app: backend-api
  ports:
  - port: 8000
    targetPort: 8000
